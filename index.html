
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love 💚</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe4ec, #f5d9ff);
    font-family: "Segoe UI", sans-serif;
    padding: 20px;
}

.love-box {
    width: 100%;
    max-width: 350px;
    min-height: 450px;
    background: #fffdfd;
    border-radius: 25px;
    padding: 28px 23px;
    text-align: center;
    box-shadow: 0 12px 35px rgba(120, 60, 90, 0.18);
    border: 2px solid white;
    overflow: hidden;
}

.page {
    display: none;
    animation: fadeIn 0.6s ease;
}

.page.active {
    display: block;
}

.heart {
    font-size: 55px;
    margin: 20px 0;
    animation: heartbeat 1.5s infinite;
}

.small-text {
    color: #88a88b;
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: bold;
    margin: 15px 0;
}

h2 {
    color: #526e55;
    font-size: 24px;
    line-height: 1.5;
    margin: 22px 0;
}

.subtitle {
    color: #b58ba0;
    font-size: 13px;
    margin: 20px 0 30px;
}

.green-btn {
    background: #70ad78;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 13px 30px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 12px rgba(75, 130, 80, 0.2);
}

.green-btn:hover {
    background: #4d9258;
    transform: translateY(-3px);
}

.picture-frame {
    width: 100%;
    height: 200px;
    padding: 6px;
    background: #e2f0df;
    border-radius: 18px;
    margin: 15px 0;
}

.picture-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 14px;
}

.love-message {
    font-size: 13px;
    color: #806775;
    line-height: 1.8;
    margin: 15px 0 22px;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.15);
    }
}
</style>
</head>

<body>

<div class="love-box">

    <!-- PAGE 1 -->
    <section id="page1" class="page active">

        <div class="heart">💚</div>

        <p class="small-text">A LITTLE MESSAGE FOR YOU</p>

        <h2>
            "Give me a million choices,
            but my heart knows your name."
        </h2>

        <p class="subtitle">
            You will always be my choice. ♡
        </p>

        <button class="green-btn" onclick="showPage2()">
            Click Me 💌
        </button>

    </section>

    <!-- PAGE 2 -->
    <section id="page2" class="page">

        <p class="small-text">MY FAVORITE PERSON</p>

        <h2>It's Always You 💚</h2>
<div class="picture-frame">
    <img src="image.jpeg" alt="Our picture">
</div>
        <p class="love-message">
            No matter how many people I meet,
            my heart will always find its way back to you.
            You are my favorite choice, today and always. ❤️
        </p>

        <button class="green-btn" onclick="showPage1()">
            ← Go Back
        </button>

    </section>

</div>

<script>
function showPage2() {
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
}

function showPage1() {
    document.getElementById("page2").classList.remove("active");
    document.getElementById("page1").classList.add("active");
}
</script>

</body>
</html>
